name: DevSecOps Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write   # required to upload SARIF to the Security tab

env:
  IMAGE_NAME: devsecops-demo
  IMAGE_TAG: ${{ github.sha }}

jobs:

  # ---------------------------------------------------------------
  # STAGE 1 - SECRETS SCANNING
  # Runs first and fails hard. A leaked credential is the one finding
  # that cannot be triaged later - by then it is already public.
  # ---------------------------------------------------------------
  secrets-scan:
    name: Secrets Scanning (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # full history - secrets hide in old commits

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: security/.gitleaks.toml

  # ---------------------------------------------------------------
  # STAGE 2 - SAST
  # Static analysis of first-party source. Semgrep runs with no token
  # so the pipeline is reproducible by anyone who forks this repo.
  # ---------------------------------------------------------------
  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4

      - name: Semgrep scan
        run: semgrep scan --config=p/default --config=p/security-audit --sarif --output=semgrep.sarif || true

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  # ---------------------------------------------------------------
  # STAGE 3 - SCA
  # Third-party dependency CVEs. Gated at HIGH/CRITICAL only -
  # gating on every MEDIUM trains developers to ignore the pipeline.
  # ---------------------------------------------------------------
  sca:
    name: SCA - Dependencies (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-fs.sarif
          severity: HIGH,CRITICAL

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs

      - name: Fail on HIGH/CRITICAL
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true     # do not block on CVEs with no patch available

  # ---------------------------------------------------------------
  # STAGE 4 - IaC SCANNING
  # Terraform misconfiguration is the most common cloud breach cause.
  # Catch open security groups and unencrypted buckets before apply.
  # ---------------------------------------------------------------
  iac-scan:
    name: IaC Scanning (Checkov)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@master
        with:
          directory: infra/
          framework: terraform
          output_format: cli,sarif
          output_file_path: console,checkov.sarif
          soft_fail: true          # report-only on the demo module

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: checkov.sarif
          category: checkov

  # ---------------------------------------------------------------
  # STAGE 5 - BUILD + IMAGE SCAN
  # Image is scanned before it is ever pushed to a registry.
  # ---------------------------------------------------------------
  build-and-scan-image:
    name: Build & Scan Image
    runs-on: ubuntu-latest
    needs: [secrets-scan, sast, sca]
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t $IMAGE_NAME:$IMAGE_TAG ./app

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          format: sarif
          output: trivy-image.sarif
          severity: HIGH,CRITICAL

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image

      - name: Save image for DAST stage
        run: docker save $IMAGE_NAME:$IMAGE_TAG -o image.tar

      - uses: actions/upload-artifact@v4
        with:
          name: app-image
          path: image.tar
          retention-days: 1

  # ---------------------------------------------------------------
  # STAGE 6 - DAST
  # Runs the built image and attacks it. This is the stage most
  # pipelines skip, and the only one that tests runtime behaviour.
  # ---------------------------------------------------------------
  dast:
    name: DAST (OWASP ZAP)
    runs-on: ubuntu-latest
    needs: [build-and-scan-image]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: app-image

      - name: Start application
        run: |
          docker load -i image.tar
          docker run -d --name app -p 8080:8080 $IMAGE_NAME:$IMAGE_TAG
          for i in $(seq 1 30); do
            curl -sf http://localhost:8080/health && break
            sleep 2
          done

      - name: ZAP baseline scan
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: http://localhost:8080
          rules_file_name: security/zap-rules.tsv
          cmd_options: '-a'
          allow_issue_writing: false

      - name: Stop application
        if: always()
        run: docker rm -f app || true

  # ---------------------------------------------------------------
  # GATE - all security stages must pass before deploy is allowed
  # ---------------------------------------------------------------
  security-gate:
    name: Security Gate
    runs-on: ubuntu-latest
    needs: [secrets-scan, sast, sca, iac-scan, build-and-scan-image, dast]
    if: always()
    steps:
      - name: Evaluate gate
        run: |
          echo "Secrets : ${{ needs.secrets-scan.result }}"
          echo "SAST    : ${{ needs.sast.result }}"
          echo "SCA     : ${{ needs.sca.result }}"
          echo "IaC     : ${{ needs.iac-scan.result }}"
          echo "Image   : ${{ needs.build-and-scan-image.result }}"
          echo "DAST    : ${{ needs.dast.result }}"
          if [ "${{ needs.secrets-scan.result }}" != "success" ] || \
             [ "${{ needs.sca.result }}" != "success" ] || \
             [ "${{ needs.build-and-scan-image.result }}" != "success" ]; then
            echo "::error::Security gate failed - blocking deploy."
            exit 1
          fi
          echo "Security gate passed."
